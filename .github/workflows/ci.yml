name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: plugins/eachlabs-ai/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/eachlabs-ai/mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:versions
      - run: npm run check:test
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-local.mjs
